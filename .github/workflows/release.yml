name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  ci:
    uses: ./.github/workflows/ci.yml

  release:
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # goreleaser is built from the Go module proxy rather than downloaded from
      # GitHub releases, whose 504s once held a release back; keep the version
      # in step with ci.yml (dependabot does not see it).
      - name: goreleaser
        run: go run github.com/goreleaser/goreleaser/v2@v2.20.0 release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
